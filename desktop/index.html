<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowVault</title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0f172a; /* Deep slate baseline */
      }
      /* Floating window should NOT have the mid-platform deep background */
      body.ui-floating {
        background-color: transparent !important;
      }
      /* Custom scrollbar for professional look */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.4);
      }

      /* ===== Floating Tray Widget helpers (ported from DESIGN-GUIDE/flow-window-design-guide) ===== */
      /* Custom Scrollbar hiding for cleaner UI */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Line clamp (Tailwind plugin equivalent) */
      .line-clamp-1,
      .line-clamp-2,
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-1 {
        -webkit-line-clamp: 1;
      }
      .line-clamp-2 {
        -webkit-line-clamp: 2;
      }
      .line-clamp-3 {
        -webkit-line-clamp: 3;
      }

      /* Knowledge Panorama modal animation (ported from DESIGN-GUIDE/knowledge-panorama) */
      @keyframes fade-in-up {
        0% {
          transform: translateY(12px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.22s ease-out forwards;
      }

      /* SupervisorBubble animations */
      @keyframes bubble-expand {
        0% {
          transform: scale(0.85) translateY(8px);
          opacity: 0;
        }
        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }
      .animate-bubble-expand {
        animation: bubble-expand 0.2s ease-out forwards;
      }
      @keyframes bounce-subtle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .animate-bounce-subtle {
        animation: bounce-subtle 1.5s ease-in-out infinite;
      }

      /* Morph toast bubble animations */
      @keyframes morph-text-in {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes morph-text-out {
        from { opacity: 1; }
        to   { opacity: 0; }
      }
      .animate-morph-text-in {
        animation: morph-text-in 0.25s ease-out both;
      }
      .animate-morph-text-out {
        animation: morph-text-out 0.15s ease-in both;
      }

      /* Snappy Animations for "Juicy" feel */
      @keyframes pop-in {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        60% {
          transform: scale(1.15);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes land {
        0% {
          transform: scale(1.02);
          border-color: #3b82f6;
        }
        40% {
          transform: scale(0.97);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes slide-up-fade {
        0% {
          transform: translateY(10px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @keyframes success-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }

      @keyframes explode {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 1;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot));
          opacity: 0;
        }
      }

      @keyframes float-around {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-5px) rotate(5deg);
        }
      }

      .animate-pop-in {
        animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .animate-land {
        animation: land 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      .animate-slide-up {
        animation: slide-up-fade 0.3s ease-out forwards;
      }
      .animate-shimmer {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      .animate-success-pulse {
        animation: success-pulse 0.6s ease-out forwards;
      }
      .particle {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
        animation: explode 0.8s ease-out forwards;
      }
      .animate-float {
        animation: float-around 3s ease-in-out infinite;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.25s ease-out both;
      }

      /* ===== Markdown prose styles for AI chat ===== */
      .prose-chat {
        font-size: 0.875rem;
        line-height: 1.7;
        color: #1e293b;
      }
      .prose-chat > *:first-child { margin-top: 0; }
      .prose-chat > *:last-child  { margin-bottom: 0; }

      .prose-chat h1, .prose-chat h2, .prose-chat h3,
      .prose-chat h4, .prose-chat h5, .prose-chat h6 {
        font-weight: 600;
        color: #0f172a;
        margin-top: 1.25em;
        margin-bottom: 0.5em;
        line-height: 1.35;
      }
      .prose-chat h1 { font-size: 1.25em; }
      .prose-chat h2 { font-size: 1.125em; }
      .prose-chat h3 { font-size: 1em; }

      .prose-chat p {
        margin-top: 0.5em;
        margin-bottom: 0.5em;
      }

      .prose-chat ul, .prose-chat ol {
        margin-top: 0.5em;
        margin-bottom: 0.5em;
        padding-left: 1.5em;
      }
      .prose-chat ul { list-style-type: disc; }
      .prose-chat ol { list-style-type: decimal; }
      .prose-chat li {
        margin-top: 0.2em;
        margin-bottom: 0.2em;
      }
      .prose-chat li > ul, .prose-chat li > ol {
        margin-top: 0.15em;
        margin-bottom: 0.15em;
      }

      .prose-chat strong { font-weight: 600; color: #0f172a; }
      .prose-chat em { font-style: italic; }

      .prose-chat code {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
        font-size: 0.825em;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        padding: 0.15em 0.35em;
        color: #be185d;
      }

      .prose-chat pre {
        margin-top: 0.75em;
        margin-bottom: 0.75em;
        padding: 0.875em 1em;
        background: #1e293b;
        border-radius: 8px;
        overflow-x: auto;
        border: 1px solid #334155;
      }
      .prose-chat pre code {
        background: none;
        border: none;
        border-radius: 0;
        padding: 0;
        font-size: 0.8em;
        color: #e2e8f0;
        line-height: 1.6;
      }

      .prose-chat blockquote {
        margin-top: 0.75em;
        margin-bottom: 0.75em;
        padding: 0.5em 0 0.5em 1em;
        border-left: 3px solid #cbd5e1;
        color: #475569;
      }
      .prose-chat blockquote p { margin: 0.25em 0; }

      .prose-chat table {
        margin-top: 0.75em;
        margin-bottom: 0.75em;
        width: 100%;
        border-collapse: collapse;
        font-size: 0.825em;
      }
      .prose-chat th {
        text-align: left;
        font-weight: 600;
        padding: 0.5em 0.75em;
        background: #f8fafc;
        border-bottom: 2px solid #e2e8f0;
        color: #334155;
      }
      .prose-chat td {
        padding: 0.4em 0.75em;
        border-bottom: 1px solid #f1f5f9;
      }
      .prose-chat tr:last-child td { border-bottom: none; }

      .prose-chat hr {
        margin: 1em 0;
        border: none;
        border-top: 1px solid #e2e8f0;
      }

      .prose-chat a {
        color: #2563eb;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .prose-chat a:hover { color: #1d4ed8; }

      .prose-chat img { max-width: 100%; border-radius: 6px; }

      /* ===== Wabi-Sabi Board (侘寂看板) ===== */
      .wabi-canvas {
        background-color: #F9F8F4;
      }
      .wabi-grid-bg {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
      }
      @keyframes wabi-card-in {
        from { opacity: 0; transform: scale(0.92) rotate(-1deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      .animate-wabi-card-in {
        animation: wabi-card-in 0.3s ease-out both;
      }
      @keyframes wabi-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .animate-wabi-pulse {
        animation: wabi-pulse 2s ease-in-out infinite;
      }
      /* Dots background pattern */
      .wabi-dots-bg {
        background-size: 24px 24px;
        background-image: radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px);
      }
      /* Connection rope animation */
      @keyframes wabi-rope-sway {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 10; }
      }
      .wabi-rope-sway {
        animation: wabi-rope-sway 3s ease-in-out infinite;
      }
      /* Group frame */
      @keyframes wabi-group-in {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }
      .animate-wabi-group-in {
        animation: wabi-group-in 0.2s ease-out both;
      }
      /* Marquee select */
      @keyframes wabi-marquee-dash {
        to { stroke-dashoffset: -8; }
      }

      /* Chat Panel overlay animations */
      @keyframes chat-backdrop-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes chat-panel-slide-in {
        from { transform: translateX(100%); }
        to   { transform: translateX(0); }
      }
      .animate-chat-backdrop {
        animation: chat-backdrop-in 0.2s ease-out forwards;
      }
      .animate-chat-panel {
        animation: chat-panel-slide-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="text-slate-900 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/renderer.jsx"></script>
  </body>
</html>
